<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Babysteps in Web Dev. A little project for a big event in our lives. See you soon, little man!"
    />
    <title>The Beginning</title>
    <link rel="stylesheet" href="./styles/main.scss" />
    <script type="module" src="./js/main.js" defer></script>
    <script type="module" src="./js/confetti.js" defer></script>
  </head>
  <body>
    <z-wrapper scene="day">
      <header>
        <nav>
          <button type="button" data-ui="scene">Change Scene</button>
          <button type="button" data-ui="effect">Celebrate</button>
        </nav>
      </header>
      <main>
        <z-countdown>
          <h1>
            <span>Love says</span>
            <span>It is what it is</span>
          </h1>
          <ul role="list">
            <li data-unit="days">
              <p>👱🏻‍♀️</p>
              <p>Days</p>
            </li>
            <li data-unit="hours">
              <p>🧑🏻</p>
              <p>Hours</p>
            </li>
            <li data-unit="minutes">
              <p>=</p>
              <p>Minutes</p>
            </li>
            <li data-unit="seconds">
              <p>👶🏻</p>
              <p>Seconds</p>
            </li>
          </ul>
        </z-countdown>
      </main>
      <z-backstage>
        <z-birds>
          <z-bird>
            <span head></span>
            <span body></span>
            <span wing-l></span>
            <span wing-r></span>
          </z-bird>
        </z-birds>
        <z-luminary>
          <z-moon>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
            <z-crater></z-crater>
          </z-moon>
          <z-sun>
            <z-rays>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </z-rays>
          </z-sun>
        </z-luminary>
      </z-backstage>

      <footer>
        <span>Made with Love</span>
        <a
          href="https://github.com/larsingerlars/babysteps"
          target="_blank"
          title="Find the code on Github"
          rel="noopener noreferrer"
        >
          <span class="sr--text">Find the code on Github</span>
          <svg
            class="github"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"

</html>
